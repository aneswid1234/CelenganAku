<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celengan Aku</title>
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/aneswid1234/CelenganAku/382515981eb2865dbe595f0be933bd538b65ffde/assets/Maskot%20Celengan%20Aku.png">
  <meta name="apple-mobile-web-app-title" content="Celengan Aku">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff6ec">
  <!-- Tailwind CSS, Chart.js, Lucide Icons, Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #48342f;
      --muted: #806b68;
      --cream: #fff5e9;
      --edge: #e9cfc0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--cream);
      font-family: "DM Sans", sans-serif;
    }
    .app-wrap {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 4% 14%, #f8cce0 0 85px, transparent 88px),
        radial-gradient(circle at 96% 28%, #eed9fa 0 115px, transparent 118px),
        radial-gradient(circle at 78% 90%, #fff0b7 0 125px, transparent 128px);
    }
    .main-inner {
      max-width: 1240px;
      margin: auto;
      padding: 20px clamp(14px, 3vw, 36px) 44px;
    }
    h1, h2, h3 {
      font-family: "Fraunces", Georgia, serif;
      letter-spacing: -0.03em;
    }
    /* Claymorphic Surfaces */
    .surface, .soft-surface, .sticker, .modal-panel {
      position: relative;
      border: 2px solid rgba(126, 79, 75, 0.13);
      border-radius: 28px 31px 27px 32px / 30px 27px 33px 28px;
      box-shadow:
        inset 0 3px 3px rgba(255, 255, 255, 0.66),
        inset 0 -5px 8px rgba(140, 87, 81, 0.09),
        0 7px 0 rgba(126, 81, 73, 0.13),
        0 16px 26px rgba(98, 61, 69, 0.12);
    }
    .soft-surface {
      border-radius: 24px 26px 23px 27px / 25px 23px 26px 24px;
      box-shadow:
        inset 0 3px 4px #ffffffa8,
        inset 0 -5px 8px #9b656314,
        0 5px 0 #80514a1b,
        0 11px 19px #6e405414;
    }
    .surface::before, .soft-surface::before {
      content: "";
      pointer-events: none;
      position: absolute;
      left: 7%;
      right: 16%;
      top: 4px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(#ffffff75, #ffffff00);
      filter: blur(3px);
    }
    /* Clay Buttons */
    .app-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 18px 20px 17px 19px / 19px 17px 20px 18px;
      padding: 10px 16px;
      font-weight: 800;
      border: 1.5px solid rgba(128, 81, 74, 0.16);
      box-shadow:
        inset 0 3px 3px #ffffff9c,
        inset 0 -4px 5px #8855511d,
        0 5px 0 #69413b3a,
        0 9px 15px #65473b22;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .app-button:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 3px 3px #ffffff9c,
        inset 0 -4px 5px #8855511d,
        0 7px 0 #69413b32,
        0 13px 18px #65473b22;
    }
    .app-button:active {
      transform: translateY(3px);
      box-shadow: inset 0 2px 4px #8855511d, 0 1px 0 #69413b3a;
    }
    .light-button {
      background: #fffaf5;
      border: 2px solid var(--edge);
      color: var(--ink);
    }
    /* Navigation */
    .nav-shell {
      border: 1.5px solid #ead5c8;
      box-shadow: inset 0 2px 3px #fff, 0 5px 0 #d5bdb060, 0 10px 17px #815c4b15;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 17px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      transition: transform 0.18s, background 0.18s, color 0.18s;
    }
    .nav-item:hover {
      transform: translateY(-2px);
      background: #fff4ed;
      color: var(--ink);
    }
    .nav-item.active {
      background: #e9d8f8;
      color: var(--ink);
      box-shadow: inset 0 3px 3px #ffffffa8, inset 0 -4px 5px #9b79b83b, 0 4px 0 #cbb1e6;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Form Fields */
    .field {
      width: 100%;
      min-height: 44px;
      padding: 9px 13px;
      border: 2px solid #ead8cc;
      border-radius: 16px;
      background: #fffdf9;
      color: var(--ink);
      box-shadow: inset 0 3px 5px #79534a0d;
    }
    .field-label {
      display: block;
      font-weight: 800;
      margin-bottom: 5px;
      font-size: 13.5px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #8466bd;
      outline-offset: 2px;
    }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }

    /* Transactions */
    .tx-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 6px;
      border-bottom: 1px solid #eaded7;
      text-align: left;
      border-radius: 14px;
      transition: background 0.15s;
    }
    .tx-row:hover { background: #fff7ef; }
    .tx-row:last-child { border-bottom: 0; }
    .tx-icon {
      flex: none;
      width: 44px;
      height: 44px;
      border: 1px solid #ffffffaa;
      border-radius: 16px 19px 15px 18px;
      display: grid;
      place-items: center;
      font-weight: 800;
      box-shadow: inset 0 3px 3px #ffffff90, inset 0 -4px 5px #6e405423, 0 4px 0 #8b5c5136;
      transition: transform 0.2s;
    }
    .tx-row:hover .tx-icon { transform: rotate(-6deg) scale(1.06); }
    .tx-amount { max-width: 44%; overflow-wrap: anywhere; text-align: right; }

    /* Charts */
    .chart-box { position: relative; height: 260px; width: 100%; }
    .chart-box.compact { height: 145px; }

    /* Modals & Toast */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(57, 46, 64, 0.58);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .modal-panel {
      width: min(100%, 540px);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff6ed;
      padding: 24px;
    }
    #toast-container {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      background: #fffdf9;
      color: var(--ink);
      border: 2px solid #d7c0ef;
      border-radius: 18px;
      padding: 12px 16px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 6px 0 #cbb1e6, 0 12px 20px rgba(72, 52, 47, 0.16);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.25s ease-out;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Decorative Clay Elements */
    .sticker {
      background: #fff8ed;
      padding: 8px;
      transform: rotate(5deg);
      box-shadow: inset 0 3px 4px #fff, 0 5px 0 #d8bda8, 0 12px 17px #714e4526;
    }
    .balance-blob {
      position: absolute;
      right: -47px;
      bottom: -77px;
      width: 210px;
      height: 210px;
      border-radius: 46% 54% 51% 49%;
      background: linear-gradient(135deg, #fff9e179, #ffffff0b);
      box-shadow: inset 12px 13px 17px #ffffff55;
    }
    .clay-disk {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 43% 57% 49% 51%;
      background: #fff9ec;
      box-shadow: inset 0 3px 3px #fff, 0 3px 0 #bb998a54, 0 6px 10px #7c534432;
    }
    .clay-disk svg { width: 17px; height: 17px; }
    .clay-wallet {
      width: 56px;
      height: 56px;
      border-radius: 18px 20px 17px 19px;
      background: #dfc9f5;
      display: grid;
      place-items: center;
      font-size: 26px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 4px 4px #ffffffb5, inset 0 -6px 7px #8c6dae40, 0 5px 0 #b695cd;
    }
    .clay-wallet img { width: 100%; height: 100%; object-fit: cover; }
    .clay-progress {
      height: 11px;
      border-radius: 999px;
      background: #f3e4d8;
      overflow: hidden;
      box-shadow: inset 0 2px 3px #8a5f4a1c, 0 2px 0 #fff;
    }
    .clay-progress > div {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: inset 0 2px 2px #ffffffa8, inset 0 -2px 2px #415f4930;
    }
    .selected-tab {
      background: #d9c6f5 !important;
      border-color: #b796e2 !important;
    }

    /* Auth / Login Screen */
    .auth-screen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px 28px;
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 8% 16%, #f8cce0 0 95px, transparent 98px),
        radial-gradient(circle at 92% 22%, #eed9fa 0 120px, transparent 123px),
        radial-gradient(circle at 18% 86%, #b8d9fb 0 85px, transparent 88px),
        radial-gradient(circle at 84% 88%, #fff0b7 0 130px, transparent 133px);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 14px;
      color: var(--muted);
      transition: all 0.18s ease;
    }
    .auth-tab-btn.active {
      background: #e9d8f8;
      color: var(--ink);
      box-shadow: inset 0 3px 3px #ffffffa8, inset 0 -4px 5px #9b79b83b, 0 4px 0 #cbb1e6;
    }
    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pw-wrap .field { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
    }
    .pw-toggle:hover { background: #f5e8de; color: var(--ink); }

    /* Mobile Fixed Bottom Navigation (20% larger) */
    .bottom-nav { display: none; }
    @media (max-width: 820px) {
      .desktop-nav { display: none !important; }
      .main-inner { padding-bottom: 118px; }
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        width: 100%;
        justify-content: space-around;
        align-items: center;
        background: #fff9f0;
        border-top: 2px solid #ead8cc;
        padding: 10px 4px max(12px, env(safe-area-inset-bottom));
        box-shadow: 0 -6px 18px rgba(105, 71, 59, 0.12);
      }
      .bottom-nav .nav-item {
        flex: 1;
        flex-direction: column;
        font-size: 11.5px;
        gap: 4px;
        padding: 8px 3px;
        border-radius: 18px;
        min-width: 0;
      }
      .bottom-nav .nav-item svg {
        width: 24px;
        height: 24px;
      }
    }
    @media (max-width: 440px) {
      .bottom-nav .nav-item { font-size: 10.5px; }
      .balance-figure { font-size: clamp(26px, 8vw, 42px) !important; }
      .app-button { padding: 9px 11px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="boot-screen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff6ec;z-index:50;">
    <img src="https://raw.githubusercontent.com/aneswid1234/CelenganAku/8be8409a05f02d92dff1fc90894ec71fb56ae035/assets/Logo%20Celengan%20Aku.png" alt="Celengan Aku" style="width:180px;opacity:.9;">
  </div>
  <div id="toast-container" aria-live="polite"></div>

  <!-- HALAMAN LOGIN & DAFTAR (FIRST-ENTRY SCREEN) -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="w-full max-w-md flex justify-end">
      <label class="sr-only" for="auth-lang">Bahasa</label>
      <select id="auth-lang" class="field !w-auto !min-h-0 !py-2 font-bold text-sm" aria-label="Bahasa">
        <option value="id">🇮🇩 ID</option>
        <option value="en">🇬🇧 EN</option>
        <option value="de">🇩🇪 DE</option>
      </select>
    </div>

    <div class="w-full max-w-md my-auto py-4">
      <div class="surface bg-[#fffdf9] p-6 sm:p-8">
        <div class="flex flex-col items-center text-center mb-5">
          <img
            id="auth-logo-img"
            class="h-16 sm:h-20 w-auto object-contain mb-2"
            src="https://raw.githubusercontent.com/aneswid1234/CelenganAku/8be8409a05f02d92dff1fc90894ec71fb56ae035/assets/Logo%20Celengan%20Aku.png"
            alt="Logo Celengan Aku"
          >
          <p id="auth-subtitle" class="muted text-xs sm:text-sm font-bold"></p>
        </div>

        <!-- Tabs: Masuk & Daftar -->
        <div class="flex gap-1.5 p-1.5 rounded-[20px] bg-[#fff5eb] border border-[#eeded2] mb-5">
          <button id="tab-login" type="button" class="auth-tab-btn active"></button>
          <button id="tab-register" type="button" class="auth-tab-btn"></button>
        </div>

        <!-- Inline Error Message -->
        <div id="auth-error" hidden class="mb-4 p-3 rounded-2xl text-xs font-extrabold flex items-center gap-2" style="background:#ffadbc;color:#5c1f2e;">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span id="auth-error-text"></span>
        </div>

        <!-- Form Masuk (Login) -->
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label id="lbl-login-id" class="field-label" for="login-identifier"></label>
            <input id="login-identifier" class="field" type="text" autocomplete="username" placeholder="nama@email.com / @username">
          </div>
          <div>
            <label id="lbl-login-pw" class="field-label" for="login-password"></label>
            <div class="pw-wrap">
              <input id="login-password" class="field" type="password" autocomplete="current-password" placeholder="••••••••">
              <button id="toggle-login-pw" type="button" class="pw-toggle" aria-label="Toggle password">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between gap-2 text-xs font-bold">
            <label class="inline-flex items-center gap-2 cursor-pointer select-none">
              <input id="login-remember" type="checkbox" checked class="w-4 h-4 accent-[#8466bd] rounded">
              <span id="lbl-remember-me"></span>
            </label>
            <button id="btn-forgot-pw" type="button" class="underline font-extrabold" style="color:#76529d;"></button>
          </div>
          <button id="btn-login-submit" type="submit" class="app-button w-full text-sm" style="background:#d9c6f5;color:#48342f;"></button>

        </form>

        <!-- Form Daftar (Register) -->
        <form id="register-form" class="space-y-3.5" hidden novalidate>
          <div>
            <label id="lbl-reg-name" class="field-label" for="reg-name"></label>
            <input id="reg-name" class="field" type="text" autocomplete="name">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label id="lbl-reg-user" class="field-label" for="reg-username"></label>
              <input id="reg-username" class="field" type="text" placeholder="@nama.kamu">
            </div>
            <div>
              <label id="lbl-reg-email" class="field-label" for="reg-email"></label>
              <input id="reg-email" class="field" type="email" autocomplete="email" placeholder="nama@email.com">
            </div>
          </div>
          <div>
            <label id="lbl-reg-pw" class="field-label" for="reg-password"></label>
            <div class="pw-wrap">
              <input id="reg-password" class="field" type="password" autocomplete="new-password" placeholder="Min. 6 karakter">
              <button id="toggle-reg-pw" type="button" class="pw-toggle" aria-label="Toggle password">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div>
            <label id="lbl-reg-confirm" class="field-label" for="reg-confirm"></label>
            <div class="pw-wrap">
              <input id="reg-confirm" class="field" type="password" autocomplete="new-password" placeholder="••••••••">
              <button id="toggle-reg-confirm" type="button" class="pw-toggle" aria-label="Toggle confirm password">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <button id="btn-reg-submit" type="submit" class="app-button w-full text-sm mt-1" style="background:#c5ebce;color:#48342f;"></button>
        </form>
      </div>
    </div>

    <footer class="text-center pt-2">
      <p class="muted font-bold text-xs">Celengan Aku · Developed by a.nes.w</p>
    </footer>
  </div>

  <!-- APLIKASI UTAMA -->
  <div id="app-main-wrap" class="app-wrap" hidden>
    <div class="main-inner">
      <!-- HEADER -->
      <header class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <a href="#home" id="logo-link" class="flex items-center shrink-0">
          <img
            id="brand-logo-img"
            class="h-14 sm:h-16 w-auto object-contain object-left"
            src="https://raw.githubusercontent.com/aneswid1234/CelenganAku/8be8409a05f02d92dff1fc90894ec71fb56ae035/assets/Logo%20Celengan%20Aku.png"
            alt="Logo Celengan Aku"
          >
        </a>
        <div class="flex flex-wrap items-center gap-2">
          <span id="badge-tagline" class="hidden sm:inline-block rounded-full px-3 py-2 font-extrabold text-xs shadow-[inset_0_2px_3px_#fff9,0_3px_0_#bfa7d3]" style="background:#e9d8f8;color:#48342f;">TEMAN MENABUNG ✦</span>
          <label class="sr-only" for="display-currency">Mata uang</label>
          <select id="display-currency" class="field !w-auto !min-h-0 !py-2 font-bold text-sm" aria-label="Mata uang">
            <option value="IDR">IDR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
          </select>
          <label class="sr-only" for="display-lang">Bahasa</label>
          <select id="display-lang" class="field !w-auto !min-h-0 !py-2 font-bold text-sm" aria-label="Bahasa">
            <option value="id">🇮🇩 ID</option>
            <option value="en">🇬🇧 EN</option>
            <option value="de">🇩🇪 DE</option>
          </select>
        </div>
      </header>

      <!-- DESKTOP NAV -->
      <nav id="desktop-nav" class="desktop-nav nav-shell flex flex-wrap gap-1 mb-6 p-2 rounded-[22px] bg-white/80 w-fit" aria-label="Navigasi utama"></nav>

      <main>
        <!-- 1. BERANDA -->
        <section id="home" class="page">
          <div class="flex justify-between items-center gap-4 mb-5">
            <div>
              <p id="home-greeting" class="font-bold mb-1 muted text-sm sm:text-base"></p>
              <h1 id="home-title" class="font-extrabold leading-tight text-2xl sm:text-3xl"></h1>
            </div>
            <div class="sticker shrink-0">
              <img
                id="pig-mascot-img"
                class="relative w-14 h-14 sm:w-20 sm:h-20 object-contain rounded-2xl"
                src="https://raw.githubusercontent.com/aneswid1234/CelenganAku/8be8409a05f02d92dff1fc90894ec71fb56ae035/assets/Maskot%20Celengan%20Aku.png"
                alt="Maskot Celengan Aku"
              >
            </div>
          </div>

          <div class="grid lg:grid-cols-[1.5fr_1fr] gap-4 mb-5">
            <section class="surface relative overflow-hidden p-6 sm:p-8" style="background:#ffc6d3;">
              <span aria-hidden="true" class="balance-blob"></span>
              <div class="relative">
                <div class="flex items-center gap-2">
                  <p id="lbl-total-balance" class="font-extrabold text-sm sm:text-base"></p>
                  <button id="privacy-btn" type="button" class="clay-disk hover:scale-105" aria-label="Toggle balance visibility">
                    <i data-lucide="eye"></i>
                  </button>
                </div>
                <p id="total-balance" class="balance-figure text-3xl sm:text-5xl font-extrabold break-all my-3 sm:my-4" aria-live="polite"></p>
                <p id="lbl-balance-desc" class="font-bold text-sm" style="color:#624e50;"></p>
              </div>
            </section>

            <div class="grid grid-cols-2 lg:grid-cols-1 gap-3">
              <section class="soft-surface p-4 sm:p-5" style="background:#b8d9fb;">
                <p id="lbl-month-income" class="font-bold text-sm sm:text-base"></p>
                <p id="income-total" class="font-extrabold text-lg sm:text-2xl mt-1.5 break-all"></p>
              </section>
              <section class="soft-surface p-4 sm:p-5" style="background:#ffadbc;">

      if (cur === "EUR") return n * (Number(state.preferences.eurRate) || 17500);
      return n;

      const n = Number(idrAmt) || 0;
      if (targetCur === "USD") return n / (Number(state.preferences.usdRate) || 16000);
      if (targetCur === "EUR") return n / (Number(state.preferences.eurRate) || 17500);
      return n;

      const val = Number(amt) || 0;
      const loc = T().locale;
      try {
        return new Intl.NumberFormat(loc, {
          style: "currency",
          currency: cur,

      if (parts.length !== 3) return iso;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (isNaN(d)) return iso;
      return new Intl.DateTimeFormat(T().locale, {

        day: "numeric",
        month: longMonth ? "long" : "short",
        year: "numeric"
      }).format(d);
    };

    // =====================================================
    // 2. WALLETS RENDERING & MODAL (WITH LOGO UPLOAD)
    // =====================================================
    const renderWallets = () => {
      const t = T();
      $("wallets-privacy-btn").innerHTML = `<i data-lucide="${state.preferences.hideWallets ? "eye-off" : "eye"}"></i>`;
      lucide.createIcons({ nodes: [$("wallets-privacy-btn")] });
      $("wallet-list").innerHTML = state.wallets.map(w => `
        <article class="surface bg-white p-5 flex flex-col justify-between gap-4">
          <div class="flex items-center gap-3.5">
            <div class="clay-wallet" style="background:${esc(w.color || "#dfc9f5")};">

    const openWalletModal = (editId = null) => {
      const t = T();
      const w = editId ? walletById(editId) : null;
      let logoData = w?.logo || "";
      const colors = ["#b8d9fb", "#c5ebce", "#ffe18c", "#e9d8f8", "#ffc6d3"];
      openModal(w ? t.walletEditTitle : t.walletAddTitle, `
        <form id="wallet-form" class="space-y-4">
          <div>
            <label class="field-label">${esc(t.walletName)}</label>
            <input name="name" class="field" value="${esc(w?.name || "")}" required>
          </div>
          <div>
            <label class="field-label">${XL("walletType")}</label>
            <select name="type" class="field">
              ${[["cash", XL("typeCash")], ["bank", XL("typeBank")], ["digital", XL("typeDigital")]].map(([v, l]) => `<option value="${v}" ${(w?.type || "cash") === v ? "selected" : ""}>${l}</option>`).join("")}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="field-label">${esc(t.walletBalance)}</label>

              <label class="field-label">${esc(t.fieldCurrency)}</label>
              <select name="currency" class="field">
                ${["IDR", "USD", "EUR"].map(c => `<option value="${c}" ${(w?.currency || state.preferences.currency) === c ? "selected" : ""}>${c}</option>`).join("")}

            </div>
          </div>
          <div>
            <label class="field-label">${esc(t.walletLogo)}</label>
            <div class="flex items-center gap-3">
              <div id="w-logo-preview" class="clay-wallet" style="background:${esc(w?.color || "#dfc9f5")};">
                ${logoData ? `<img src="${esc(logoData)}" alt="preview">` : esc(w?.icon || "💳")}
              </div>
              <div class="flex-1 space-y-2">
                <div class="flex gap-4 text-xs font-bold">
                  <label class="flex items-center gap-1"><input type="radio" name="logo-mode" value="url" checked>${XL("pasteUrl")}</label>
                  <label class="flex items-center gap-1"><input type="radio" name="logo-mode" value="file"> ${XL("uploadFile")}</label>
                </div>
                <input id="w-logo-url" type="url" class="field !py-2 text-xs" placeholder="https://raw.githubusercontent.com/nama/repo/main/logo.png" value="${esc(/^https?:\/\//.test(logoData) ? logoData : "")}">
                <input id="w-logo-file" type="file" accept="image/*" class="field !py-2 text-xs" hidden>
                <button type="button" id="w-logo-remove" class="app-button light-button !py-1.5 !px-3 text-xs" ${logoData ? "" : "hidden"}>${esc(t.removeLogo)}</button>
              </div>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="m-cancel" class="app-button light-button text-sm">${esc(t.cancel)}</button>
            <button type="submit" class="app-button text-sm" style="background:#d9c6f5;color:#48342f;">${esc(t.save)}</button>
          </div>
        </form>
      `);
      $("m-cancel").onclick = closeModal;
      const applyLogo = val => {
        logoData = val;
        $("w-logo-preview").innerHTML = val
          ? `<img src="${esc(val)}" alt="preview">`
          : esc(w?.icon || "💳");
        $("w-logo-remove").hidden = !val;
      };
      document.querySelectorAll('input[name="logo-mode"]').forEach(r => {
        r.onchange = () => {
          const isFile = document.querySelector('input[name="logo-mode"]:checked').value === "file";
          $("w-logo-url").hidden = isFile;
          $("w-logo-file").hidden = !isFile;
        };
      });
      // Ubah tautan halaman GitHub (blob) menjadi tautan raw otomatis
      const toRawLogo = v => {
        const m = v.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
        return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}` : v;
      };
      $("w-logo-url").oninput = ev => {
        const raw = ev.target.value.trim();
        const v = toRawLogo(raw);
        if (v !== raw) ev.target.value = v;
        applyLogo(/^https?:\/\//.test(v) ? v : "");
      };
      $("w-logo-file").onchange = ev => {
        const file = ev.target.files?.[0];
        if (!file) return;
        if (file.size > 100 * 1024) {
          showToast(XL("fileTooBig"));
          ev.target.value = "";
          return;

        const reader = new FileReader();
        reader.onload = () => applyLogo(reader.result);
        reader.readAsDataURL(file);

      $("w-logo-remove").onclick = () => {
        $("w-logo-url").value = "";
        $("w-logo-file").value = "";
        applyLogo("");

      $("wallet-form").onsubmit = async ev => {

        const fd = new FormData(ev.target);

        const newBalance = Number(fd.get("balance")) || 0;
        const currency = fd.get("currency").toString();
        const type = fd.get("type").toString();
        const today = new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD lokal

        if (w) {
          const row = state.wallets.find(x => x.id === w.id);
          const { error: upErr } = await sb
            .from("wallets")
            .update({ name, type, currency, logo_url: logoData || null })
            .eq("id", row.dbId);
          if (upErr) {
            showToast(XL("errSaveWallet") + upErr.message);
            return;
          }
          // Perubahan saldo manual dicatat sebagai koreksi
          const diff = newBalance - (Number(w.balance) || 0);
          if (diff !== 0) {
            const { error: adjErr } = await sb.from("transactions").insert({
              user_id: currentUserId,
              type: "adjustment",
              amount: diff,
              wallet_id: row.dbId,
              transaction_date: today,
              notes: "Koreksi saldo manual"
            });
            if (adjErr) {
              showToast(XL("errAdj") + adjErr.message);
              return;
            }
          }
        } else {
          const { error: insErr } = await sb.from("wallets").insert({
            user_id: currentUserId,
            name,
            type,
            currency,
            initial_balance: newBalance,
            logo_url: logoData || null
          });
          if (insErr) {
            showToast(XL("errCreateWallet") + insErr.message);
            return;
          }
        }

        await reloadFromDatabase();
        closeModal();
        renderAll();
        showToast(t.toastSaved);
      };
    };

    // =====================================================
    // 3. ACTIVITY RENDERING (DYNAMIC CATEGORY, 3 CHARTS)
    // =====================================================
    const fillActivityFilters = () => {
      const t = T();
      const prevWallet = $("wallet-filter").value || "all";
      $("wallet-filter").innerHTML = `<option value="all">${esc(t.allWallets)}</option>` +
        state.wallets.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join("");
      $("wallet-filter").value = prevWallet;

      fillCategoryFilter();
    };

    const fillCategoryFilter = () => {
      const t = T();
      const typeVal = $("type-filter").value || "all";
      const prevCat = $("category-filter").value || "all";
      let html = `<option value="all">${esc(t.allCats)}</option>`;

      if (typeVal === "income") {
        html += state.categories.income.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      } else if (typeVal === "expense") {
        html += state.categories.expense.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
      } else if (typeVal === "transfer") {
        html += `<option value="Transfer">Transfer</option>`;
      } else {
        html += `<optgroup label="${esc(t.typeIncome)}">` +
          state.categories.income.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("") +
          `</optgroup><optgroup label="${esc(t.typeExpense)}">` +
          state.categories.expense.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("") +
          `</optgroup><optgroup label="${esc(t.typeTransfer)}"><option value="Transfer">Transfer</option></optgroup>`;
      }
      $("category-filter").innerHTML = html;
      const validValues = Array.from($("category-filter").options).map(o => o.value);
      $("category-filter").value = validValues.includes(prevCat) ? prevCat : "all";
    };

    const getFilteredTransactions = () => {
      const q = ($("search").value || "").trim().toLowerCase();
      const typeVal = $("type-filter").value || "all";
      const catVal = $("category-filter").value || "all";
      const wVal = $("wallet-filter").value || "all";
      const fromVal = $("date-from").value || "";
      const toVal = $("date-to").value || "";

      return state.transactions.filter(tx => {
        if (typeVal !== "all" && tx.type !== typeVal) return false;
        if (catVal !== "all" && tx.category !== catVal) return false;
        if (wVal !== "all" && tx.walletId !== wVal && tx.toWalletId !== wVal) return false;
        if (fromVal && tx.date < fromVal) return false;
        if (toVal && tx.date > toVal) return false;
        if (q) {
          const wName = walletById(tx.walletId)?.name || "";
          const hay = `${tx.category} ${tx.note || ""} ${wName} ${tx.date}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => b.date.localeCompare(a.date));
    };

    // Custom Chart.js plugin to draw percentage labels inside 100% stacked horizontal bar
    const stackedPctPlugin = {
      id: "stackedPctLabels",
      afterDatasetsDraw(chart) {
        if (chart.config._customMode !== "block") return;
        const { ctx } = chart;
        ctx.save();
        ctx.font = "800 13px 'DM Sans', sans-serif";
        ctx.fillStyle = "#48342f";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        chart.data.datasets.forEach((ds, i) => {
          const meta = chart.getDatasetMeta(i);
          if (meta.hidden) return;
          meta.data.forEach((bar, idx) => {
            const val = Number(ds.data[idx]) || 0;
            if (val >= 7) {
              const x = (bar.base + bar.x) / 2;
              ctx.fillText(`${Math.round(val)}%`, x, bar.y);
            }
          });
        });
        ctx.restore();
      }
    };

    const renderActivityChart = list => {
      const t = T();
      const cur = state.preferences.currency;
      const mode = $("activity-chart-type").value || activityChartType;
      activityChartType = mode;

      const container = $("activity-chart-container");
      container.classList.toggle("compact", mode === "block");

      if (activityChartInst) activityChartInst.destroy();
      const ctx = $("activity-chart");

      const incTotal = list.filter(x => x.type === "income").reduce((s, x) => s + convert(x.amount, x.currency, cur), 0);
      const expTotal = list.filter(x => x.type === "expense").reduce((s, x) => s + convert(x.amount, x.currency, cur), 0);
      const trfTotal = list.filter(x => x.type === "transfer").reduce((s, x) => s + convert(x.amount, x.currency, cur), 0);

      if (mode === "bar") {
        // X-axis = Category! Grouped by Pemasukan, Pengeluaran, Transfer
        const catOrder = [];
        const mapInc = {}, mapExp = {}, mapTrf = {};
        list.forEach(tx => {
          const cat = tx.category || "Lainnya";
          if (!catOrder.includes(cat)) catOrder.push(cat);
          const amt = convert(tx.amount, tx.currency, cur);
          if (tx.type === "income") mapInc[cat] = (mapInc[cat] || 0) + amt;
          else if (tx.type === "expense") mapExp[cat] = (mapExp[cat] || 0) + amt;
          else mapTrf[cat] = (mapTrf[cat] || 0) + amt;
        });

        activityChartInst = new Chart(ctx, {
          type: "bar",
          data: {
            labels: catOrder.length ? catOrder : ["-"],
            datasets: [
              { label: t.typeIncome, data: catOrder.map(c => mapInc[c] || 0), backgroundColor: "#b8d9fb", borderRadius: 10, maxBarThickness: 42 },
              { label: t.typeExpense, data: catOrder.map(c => mapExp[c] || 0), backgroundColor: "#ffadbc", borderRadius: 10, maxBarThickness: 42 },
              { label: t.typeTransfer, data: catOrder.map(c => mapTrf[c] || 0), backgroundColor: "#ffe18c", borderRadius: 10, maxBarThickness: 42 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom" },
              tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtMoney(c.raw, cur)}` } }
            },
            scales: {
              x: { stacked: true, grid: { display: false } },
              y: { stacked: true, beginAtZero: true, grid: { color: "#f3e5da" } }
            }
          }
        });
      } else if (mode === "block") {
        // 100% Stacked Horizontal Bar comparing Pemasukan, Pengeluaran, Transfer
        const grand = incTotal + expTotal + trfTotal;
        const incPct = grand ? (incTotal / grand) * 100 : 0;
        const expPct = grand ? (expTotal / grand) * 100 : 0;
        const trfPct = grand ? (trfTotal / grand) * 100 : 0;

        activityChartInst = new Chart(ctx, {
          type: "bar",
          plugins: [stackedPctPlugin],
          data: {
            labels: [""],
            datasets: [
              { label: `${t.typeIncome} (${fmtMoney(incTotal, cur)})`, data: [incPct], rawVal: incTotal, backgroundColor: "#b8d9fb", borderRadius: 10, barThickness: 42 },
              { label: `${t.typeExpense} (${fmtMoney(expTotal, cur)})`, data: [expPct], rawVal: expTotal, backgroundColor: "#ffadbc", borderRadius: 10, barThickness: 42 },
              { label: `${t.typeTransfer} (${fmtMoney(trfTotal, cur)})`, data: [trfPct], rawVal: trfTotal, backgroundColor: "#ffe18c", borderRadius: 10, barThickness: 42 }
            ]
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom" },
              tooltip: {
                callbacks: {
                  label: c => `${c.dataset.label} — ${c.raw.toFixed(1)}%`
                }
              }
            },
            scales: {
              x: { stacked: true, min: 0, max: 100, ticks: { callback: v => `${v}%` }, grid: { color: "#f3e5da" } },
              y: { stacked: true, grid: { display: false } }
            }
          }
        });
        activityChartInst.config._customMode = "block";
        activityChartInst.update();
      } else {
        // Pie Chart
        activityChartInst = new Chart(ctx, {
          type: "pie",
          data: {
            labels: [t.typeIncome, t.typeExpense, t.typeTransfer],
            datasets: [{
              data: [incTotal, expTotal, trfTotal],
              backgroundColor: ["#b8d9fb", "#ffadbc", "#ffe18c"],
              borderColor: "#fffdf8",
              borderWidth: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom" },
              tooltip: { callbacks: { label: c => `${c.label}: ${fmtMoney(c.raw, cur)}` } }
            }
          }
        });
      }
    };

    const renderActivity = () => {
      const t = T();
      fillActivityFilters();
      const list = getFilteredTransactions();
      const cur = state.preferences.currency;

      const incSum = list.filter(x => x.type === "income").reduce((s, x) => s + convert(x.amount, x.currency, cur), 0);
      const expSum = list.filter(x => x.type === "expense").reduce((s, x) => s + convert(x.amount, x.currency, cur), 0);

    // Transaction Modals (Add, Detail, Edit)
    const openTxModal = (type = "expense", editTx = null) => {
      const t = T();
      const txType = editTx ? editTx.type : type;
      const typeLabel = txType === "income" ? t.typeIncome : txType === "expense" ? t.typeExpense : t.typeTransfer;
      const cats = txType === "income" ? state.categories.income : txType === "expense" ? state.categories.expense : ["Transfer"];
      const todayIso = "2026-11-20";

      openModal(editTx ? t.txEditTitle : t.txAddTitle(typeLabel), `
        <form id="tx-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="field-label">${esc(t.fieldAmount)}</label>
              <input name="amount" type="number" min="1" step="any" class="field" value="${editTx ? editTx.amount : ""}" required>
            </div>
            <div>
              <label class="field-label">${esc(t.fieldCurrency)}</label>
              <select name="currency" class="field">
                ${["IDR", "USD", "EUR"].map(c => `<option value="${c}" ${(editTx?.currency || state.preferences.currency) === c ? "selected" : ""}>${c}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">

                ${state.wallets.map(w => `<option value="${esc(w.id)}" ${(editTx?.walletId || state.wallets[0]?.id) === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
              </select>
            </div>
            ${txType === "transfer" ? `
              <div>
                <label class="field-label">${esc(t.fieldToWallet)}</label>
                <select name="toWalletId" class="field">
                  ${state.wallets.map((w, i) => `<option value="${esc(w.id)}" ${(editTx?.toWalletId || state.wallets[1]?.id || state.wallets[0]?.id) === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}
                </select>
              </div>
            ` : `
              <div>
                <label class="field-label">${esc(t.fieldCategory)}</label>
                <select name="category" class="field">
                  ${cats.map(c => `<option value="${esc(c)}" ${editTx?.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
                </select>
              </div>
            `}
          </div>
          <div>
            <label class="field-label">${esc(t.fieldDate)}</label>
            <input name="date" type="date" class="field" value="${esc(editTx?.date || todayIso)}" required>
          </div>
          <div>
            <label class="field-label">${esc(t.fieldNote)}</label>
            <input name="note" class="field" value="${esc(editTx?.note || "")}">
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="m-cancel" class="app-button light-button text-sm">${esc(t.cancel)}</button>
            <button type="submit" class="app-button text-sm" style="background:#d9c6f5;color:#48342f;">${esc(t.save)}</button>
          </div>
        </form>
      `);
      $("m-cancel").onclick = closeModal;
      $("tx-form").onsubmit = async ev => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const amountInput = Number(fd.get("amount")) || 0;
        const inputCurrency = fd.get("currency").toString();
        const walletId = fd.get("walletId").toString();
        const toWalletId = txType === "transfer" ? fd.get("toWalletId").toString() : "";
        const category = txType === "transfer" ? "Transfer" : fd.get("category").toString();
        const date = fd.get("date").toString();
        const note = fd.get("note").toString().trim();

        if (!(amountInput > 0)) {
          showToast(XL("errAmount"));
          return;
        }
        const srcW = walletById(walletId);
        const dstW = txType === "transfer" ? walletById(toWalletId) : null;
        if (!srcW) {
          showToast(XL("errPickWallet"));
          return;
        }
        if (txType === "transfer" && (!dstW || dstW.id === srcW.id)) {
          showToast(XL("errPickTo"));
          return;
        }
        const catRow = txType === "transfer"
          ? null
          : state.categoryRows.find(r => r.kind === txType && r.name === category);
        if (txType !== "transfer" && !catRow) {
          showToast(XL("errCatNotFound"));
          return;
        }

        // Jumlah disimpan dalam mata uang dompet, dengan kurs saat ini
        const amount = Number(convert(amountInput, inputCurrency, srcW.currency).toFixed(2));
        const toAmount = dstW
          ? Number(convert(amountInput, inputCurrency, dstW.currency).toFixed(2))
          : null;

        const payload = {
          user_id: currentUserId,
          type: txType,
          amount,
          wallet_id: srcW.dbId,
          to_wallet_id: dstW ? dstW.dbId : null,
          to_amount: toAmount,
          category_id: catRow ? catRow.id : null,
          transaction_date: date,
          notes: note || null
        };

        const { error } = editTx
          ? await sb.from("transactions").update(payload).eq("id", editTx.dbId)
          : await sb.from("transactions").insert(payload);
        if (error) {
          showToast(XL("errSaveTx") + error.message);
          return;
        }

        await reloadFromDatabase();
        closeModal();
        renderAll();
        showToast(t.toastSaved);
      };
    };

    const openTxDetailModal = txId => {
      const t = T();
      const tx = state.transactions.find(x => x.id === txId);
      if (!tx) return;
      const w = walletById(tx.walletId);
      const wTo = tx.toWalletId ? walletById(tx.toWalletId) : null;
      openModal(t.txDetail, `
        <div class="space-y-3 text-sm">
          <div class="soft-surface p-4 bg-white space-y-2">
            <div class="flex justify-between"><span class="muted font-bold">${esc(t.fieldCategory)}</span><strong>${esc(tx.category)}</strong></div>
            <div class="flex justify-between"><span class="muted font-bold">${esc(t.fieldAmount)}</span><strong>${esc(fmtMoney(tx.amount, tx.currency))}</strong></div>
            <div class="flex justify-between"><span class="muted font-bold">${esc(t.fieldDate)}</span><strong>${esc(fmtDate(tx.date, true))}</strong></div>
            <div class="flex justify-between"><span class="muted font-bold">${esc(t.fieldWallet)}</span><strong>${esc(tx.type === "transfer" && wTo ? `${w?.name || "-"} → ${wTo.name}` : (w?.name || "-"))}</strong></div>
            <div class="flex justify-between"><span class="muted font-bold">${esc(t.fieldNote)}</span><strong>${esc(tx.note || "-")}</strong></div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="tx-del" class="app-button text-sm" style="background:#ffadbc;color:#48342f;">${esc(t.delete)}</button>
            <button type="button" id="tx-edit" class="app-button text-sm" style="background:#d9c6f5;color:#48342f;">${esc(t.edit)}</button>
          </div>
        </div>
      `);
      $("tx-edit").onclick = () => openTxModal(tx.type, tx);
      $("tx-del").onclick = async () => {
        const { error } = await sb.from("transactions").delete().eq("id", tx.dbId);
        if (error) {
          showToast(XL("errDelTx") + error.message);
          return;
        }
        await reloadFromDatabase();
        closeModal();
        renderAll();
        showToast(t.toastDeleted);
      };
    };

    // =====================================================
    // 4. BUDGET RENDERING (MONTH FILTER + CURRENCY)
    // =====================================================
    const renderBudgets = () => {
      const t = T();
      const cur = state.preferences.currency;
      $("budget-month-filter").value = selectedBudgetMonth;
      $("budget-page-title").textContent = t.budgetTitle(fmtMonthLabel(selectedBudgetMonth));

      const monthBudgets = state.budgets.filter(b => b.month === selectedBudgetMonth);
      const monthExp = state.transactions.filter(tx => tx.type === "expense" && (tx.date || "").startsWith(selectedBudgetMonth));

      let sumLimit = 0;
      let sumSpent = 0;

      const cardsHtml = monthBudgets.map(b => {
        const limitDisp = convert(b.limit, b.currency || "IDR", cur);
        const spentDisp = monthExp
          .filter(tx => tx.category === b.category)
          .reduce((s, tx) => s + convert(tx.amount, tx.currency, cur), 0);
        sumLimit += limitDisp;
        sumSpent += spentDisp;

        const pct = limitDisp > 0 ? Math.round((spentDisp / limitDisp) * 100) : 0;
        const barW = Math.min(100, pct);
        const barColor = pct >= 100 ? "#f26b8a" : pct >= 75 ? "#ffd166" : "#8cd79f";

        return `
          <article class="surface bg-white p-5 space-y-3">
            <div class="flex justify-between items-start gap-2">
              <div>
                <h3 class="font-extrabold text-lg">${esc(b.category)}</h3>
                <p class="muted text-xs font-bold">${esc(fmtMoney(b.limit, b.currency || "IDR"))}</p>
              </div>
              <div class="flex gap-1.5">
                <button type="button" class="app-button light-button !py-1.5 !px-2.5 text-xs" data-edit-b="${esc(b.id)}">${esc(t.edit)}</button>
                <button type="button" class="app-button !py-1.5 !px-2.5 text-xs" style="background:#ffadbc;color:#48342f;" data-del-b="${esc(b.id)}">×</button>
              </div>
            </div>
            <div class="clay-progress"><div style="width:${barW}%;background:${barColor};"></div></div>
            <div class="flex justify-between text-xs font-extrabold">
              <span>${esc(fmtMoney(spentDisp, cur))} / ${esc(fmtMoney(limitDisp, cur))}</span>
              <span style="color:${pct >= 100 ? "#c03252" : "#4a6b54"};">${pct >= 100 ? esc(t.overBudget) : esc(t.usedPct(pct))}</span>
            </div>
          </article>
        `;
      }).join("");

      $("budget-total").textContent = fmtMoney(sumLimit, cur, true);
      $("budget-spent").textContent = fmtMoney(sumSpent, cur, true);
      $("budget-left").textContent = fmtMoney(sumLimit - sumSpent, cur, true);

      $("budget-list").innerHTML = monthBudgets.length
        ? cardsHtml
        : `<div class="surface bg-white p-8 text-center sm:col-span-2 lg:col-span-3"><p class="muted font-bold">${esc(t.noBudget)}</p></div>`;

      $("budget-list").querySelectorAll("[data-edit-b]").forEach(btn => {
        btn.onclick = () => openBudgetModal(btn.dataset.editB);
      });
      $("budget-list").querySelectorAll("[data-del-b]").forEach(btn => {
        btn.onclick = async () => {
          const row = state.budgets.find(b => b.id === btn.dataset.delB);
          const { error } = await sb.from("budgets").delete().eq("id", row.dbId);
          if (error) {
            showToast(XL("errDelBudget") + error.message);
            return;
          }
          await reloadFromDatabase();
          renderBudgets();
          showToast(t.toastDeleted);
        };
      });
    };

    const openBudgetModal = (editId = null) => {
      const t = T();
      const b = editId ? state.budgets.find(x => x.id === editId) : null;
      openModal(b ? t.budgetEditTitle : t.budgetAddTitle, `
        <form id="budget-form" class="space-y-4">
          <div>
            <label class="field-label">${esc(t.fieldCategory)}</label>
            <select name="category" class="field">
              ${state.categories.expense.map(c => `<option value="${esc(c)}" ${b?.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="field-label">${esc(t.budgetLimit)}</label>

            </div>
            <div>
              <label class="field-label">${esc(t.fieldCurrency)}</label>
              <select name="currency" class="field">
                ${["IDR", "USD", "EUR"].map(c => `<option value="${c}" ${(b?.currency || state.preferences.currency) === c ? "selected" : ""}>${c}</option>`).join("")}

            <button type="submit" class="app-button text-sm" style="background:#d9c6f5;color:#48342f;">${esc(t.save)}</button>
          </div>
        </form>
      `);
      $("m-cancel").onclick = closeModal;
      $("budget-form").onsubmit = async ev => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const catLabel = fd.get("category").toString();
        const limit = Number(fd.get("limit")) || 0;
        const currency = fd.get("currency").toString();
        const month = fd.get("month").toString(); // YYYY-MM

        if (!(limit > 0)) {
          showToast(XL("errBudgetLimit"));
          return;
        }
        const catRow = state.categoryRows.find(r => r.kind === "expense" && r.name === catLabel);
        if (!catRow) {
          showToast(XL("errCatNotFound"));
          return;
        }

        const payload = {
          user_id: currentUserId,
          category_id: catRow.id,
          kind: "expense",
          month: `${month}-01`,
          amount: limit,
          currency
        };
        const { error } = b
          ? await sb.from("budgets").update(payload).eq("id", b.dbId)
          : await sb.from("budgets").insert(payload);
        if (error) {
          showToast(error.code === "23505"
            ? XL("errBudgetDup")
            : XL("errSaveBudget") + error.message);
          return;
        }

        selectedBudgetMonth = month;
        await reloadFromDatabase();
        closeModal();
        renderBudgets();
        showToast(t.toastSaved);
      };
    };

    // =====================================================
    // 5. SPLIT BILL (PATUNGAN) — TAX/SERVICE + INSTALLMENTS
    // =====================================================
    const calcBillTotals = bill => {
      const subtotal = bill.items.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
      const taxAmt = bill.taxType === "percent" ? subtotal * ((Number(bill.taxValue) || 0) / 100) : (Number(bill.taxValue) || 0);
      const serviceAmt = bill.serviceType === "percent" ? subtotal * ((Number(bill.serviceValue) || 0) / 100) : (Number(bill.serviceValue) || 0);
      const grandTotal = subtotal + taxAmt + serviceAmt;

      const shares = {};
      bill.friends.forEach(f => { shares[f.id] = 0; });

      if (bill.mode === "equal") {
        const n = bill.friends.length || 1;
        bill.friends.forEach(f => { shares[f.id] = grandTotal / n; });
      } else if (bill.mode === "item") {
        const rawShares = {};
        bill.friends.forEach(f => { rawShares[f.id] = 0; });
        let assignedSum = 0;
        bill.items.forEach(it => {
          const line = (Number(it.price) || 0) * (Number(it.qty) || 1);
          const validF = (it.assignedTo || []).filter(fid => bill.friends.some(f => f.id === fid));
          if (validF.length) {
            const per = line / validF.length;
            validF.forEach(fid => { rawShares[fid] += per; });
            assignedSum += line;
          }
        });
        const extra = taxAmt + serviceAmt;
        bill.friends.forEach(f => {
          const base = rawShares[f.id] || 0;
          const propExtra = assignedSum > 0 ? (base / assignedSum) * extra : (extra / (bill.friends.length || 1));
          shares[f.id] = base + propExtra;
        });
      } else {
        bill.friends.forEach(f => { shares[f.id] = Number(f.manualAmount) || 0; });
      }

      let collected = 0;
      let paidCount = 0;
      const friendStats = bill.friends.map(f => {
        const owed = shares[f.id] || 0;
        const paid = (f.installments || []).reduce((s, ins) => s + (Number(ins.amount) || 0), 0);
        const remain = Math.max(0, owed - paid);
        const pct = owed > 0 ? Math.min(100, Math.round((paid / owed) * 100)) : (paid > 0 ? 100 : 0);
        const status = owed <= 0 || paid >= owed - 0.5 ? "paid" : paid > 0 ? "partial" : "unpaid";
        if (status === "paid") paidCount++;
        collected += paid;
        return { friend: f, owed, paid, remain, pct, status };
      });

      return { subtotal, taxAmt, serviceAmt, grandTotal, collected, paidCount, friendStats };
    };

    // Simpan satu tagihan utuh ke database, lalu muat ulang data
    const saveBill = async bill => {
      const payload = {
        id: bill.dbId || null,
        title: bill.title || "",
        date: bill.date,
        currency: bill.currency,
        mode: bill.mode,
        tax_type: bill.taxType === "percent" ? "percent" : "nominal",
        tax_value: Number(bill.taxValue) || 0,
        service_type: bill.serviceType === "percent" ? "percent" : "nominal",
        service_value: Number(bill.serviceValue) || 0,
        friends: bill.friends.map(f => ({
          key: String(f.id),
          name: f.name,
          manual_amount: Number(f.manualAmount) || 0,
          installments: (f.installments || []).map(i => ({
            amount: Number(i.amount) || 0,
            date: i.date,
            note: i.note || null
          }))
        })),
        items: bill.items.map(it => ({
          name: it.name,
          price: Number(it.price) || 0,
          qty: Number(it.qty) || 1,
          assigned: (it.assignedTo || []).map(String)
        }))
      };
      const { data, error } = await sb.rpc("save_split_bill", { p: payload });
      if (error) {
        showToast(XL("errSaveBill") + error.message);
        await reloadFromDatabase();
        renderSplitBills();
        return;
      }
      activeBillId = String(data);
      await reloadFromDatabase();
      renderSplitBills();
    };

    let billQueue = Promise.resolve();
    const queueBillSave = bill => {
      billQueue = billQueue.then(() => saveBill(bill));
    };

    const deleteBill = async bill => {
      const { error } = await sb.from("split_bills").delete().eq("id", bill.dbId);
      if (error) {
        showToast(XL("errDelBill") + error.message);
        return;
      }
      activeBillId = null;
      await reloadFromDatabase();
      renderSplitBills();
    };

    const renderSplitBills = () => {
      const t = T();
      if (!state.splitBills.length) {
        $("bill-selector").innerHTML = "";
        $("active-bill-panel").innerHTML = `<div class="surface bg-white p-8 text-center"><p class="muted font-bold">${esc(t.noBills)}</p></div>`;
        return;
      }
      if (!state.splitBills.some(b => b.id === activeBillId)) {
        activeBillId = state.splitBills[0].id;
      }

      // Selector Cards
      $("bill-selector").innerHTML = state.splitBills.map(b => {
        const calc = calcBillTotals(b);
        const isActive = b.id === activeBillId;
        const modeLbl = b.mode === "equal" ? t.modeEqual : b.mode === "item" ? t.modeItem : t.modeManual;
        return `
          <button type="button" class="soft-surface p-4 text-left transition-transform hover:-translate-y-0.5 ${isActive ? "selected-tab" : "bg-white"}" data-select-bill="${esc(b.id)}">
            <div class="flex justify-between items-start gap-2 mb-1.5">
              <strong class="text-base truncate">${esc(b.title)}</strong>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-white/80 shrink-0">${esc(modeLbl)}</span>
            </div>
            <p class="muted text-xs font-bold mb-2">${esc(fmtDate(b.date))}</p>
            <div class="flex justify-between items-center text-xs font-extrabold">
              <span>${esc(fmtMoney(calc.grandTotal, b.currency))}</span>
              <span style="color:#4a6b54;">${esc(t.settledCount(calc.paidCount, b.friends.length))}</span>
            </div>
          </button>
        `;
      }).join("");

      $("bill-selector").querySelectorAll("[data-select-bill]").forEach(btn => {
        btn.onclick = () => { activeBillId = btn.dataset.selectBill; renderSplitBills(); };
      });

      // Active Bill Detail
      const bill = state.splitBills.find(b => b.id === activeBillId);
      const calc = calcBillTotals(bill);
      const manualSum = bill.friends.reduce((s, f) => s + (Number(f.manualAmount) || 0), 0);
      const manualDiff = calc.grandTotal - manualSum;

      $("active-bill-panel").innerHTML = `
        <div class="surface bg-[#fffdf8] p-5 sm:p-6 space-y-6">
          <!-- Header & Mode Switch -->
          <div class="flex flex-wrap justify-between items-start gap-3 pb-4 border-b-2 border-[#f1e1d4]">
            <div>
              <h2 class="font-extrabold text-2xl">${esc(bill.title)}</h2>
              <p class="muted text-xs sm:text-sm font-bold mt-0.5">${esc(fmtDate(bill.date, true))} · ${esc(t.collectedLabel)}: ${esc(fmtMoney(calc.collected, bill.currency))} / ${esc(fmtMoney(calc.grandTotal, bill.currency))}</p>
            </div>

              return `<button type="button" class="app-button light-button text-xs sm:text-sm ${bill.mode === m ? "selected-tab" : ""}" data-sb-mode="${m}">${esc(lbl)}</button>`;

                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-[#fff4e8] border border-[#e9cfc0] font-extrabold text-xs">
                  ${esc(f.name)}
                  ${bill.friends.length > 1 ? `<button type="button" class="text-[#a6304c] font-extrabold ml-1" data-del-friend="${esc(f.id)}">×</button>` : ""}

            </div>
            <form id="sb-add-friend-form" class="flex gap-2">
              <input id="sb-friend-name" class="field !min-h-0 !py-2 text-sm" placeholder="${esc(t.addFriendPh)}" required>
              <button type="submit" class="app-button !py-2 text-xs shrink-0" style="background:#e9d8f8;color:#48342f;">${esc(t.addFriendBtn)}</button>
            </form>
          </div>

          <!-- Items + Tax & Service (ALWAYS VISIBLE IN ALL 3 MODES) -->
          <div class="space-y-3">
            <h3 class="font-extrabold text-lg">${esc(t.itemsTitle)}</h3>
            <div class="space-y-2.5">
              ${bill.items.map(it => {
                const lineTotal = (Number(it.price) || 0) * (Number(it.qty) || 1);
                return `
                  <div class="soft-surface bg-white p-3.5 space-y-2">
                    <div class="flex justify-between items-center gap-2">
                      <div class="min-w-0">
                        <p class="font-extrabold text-sm">${esc(it.name)} <span class="muted">×${it.qty}</span></p>

                        <button type="button" class="app-button !py-1 !px-2 text-xs" style="background:#ffadbc;color:#48342f;" data-del-item="${esc(it.id)}">×</button>
                      </div>
                    </div>
                    ${bill.mode === "item" ? `
                      <div class="pt-2 border-t border-[#f2e4d9]">
                        <p class="muted text-[11px] font-bold mb-1.5">${esc(t.selectFriendsHint)}</p>
                        <div class="flex flex-wrap gap-1.5">

            <!-- Add Item Form -->

              <input id="sb-item-name" class="field !min-h-0 !py-2 text-sm" placeholder="${esc(t.itemNamePh)}" required>
              <input id="sb-item-price" type="number" min="0" step="any" class="field !min-h-0 !py-2 text-sm" placeholder="${esc(t.itemPricePh)}" required>

              <button type="submit" class="app-button !py-2 text-xs" style="background:#b8d9fb;color:#48342f;">${esc(t.addItemBtn)}</button>

            <!-- Tax & Service Fee Box (Always visible in Equal, Item, & Manual modes) -->
            <div class="soft-surface bg-[#fff8ef] p-4 grid sm:grid-cols-2 gap-3">

                <div class="flex gap-1.5">
                  <select id="sb-tax-type" class="field !w-auto !min-h-0 !py-2 text-xs font-bold">

                  <input id="sb-tax-val" type="number" min="0" step="any" class="field !min-h-0 !py-2 text-sm" value="${bill.taxValue || 0}">
                </div>
              </div>
              <div>
                <label class="field-label text-xs">${esc(t.serviceLabel)}</label>
                <div class="flex gap-1.5">
                  <select id="sb-srv-type" class="field !w-auto !min-h-0 !py-2 text-xs font-bold">
                    <option value="percent" ${bill.serviceType === "percent" ? "selected" : ""}>${esc(t.typePct)}</option>
                    <option value="amount" ${bill.serviceType === "amount" ? "selected" : ""}>${esc(t.typeAmt)}</option>

                  <input id="sb-srv-val" type="number" min="0" step="any" class="field !min-h-0 !py-2 text-sm" value="${bill.serviceValue || 0}">
                </div>

            <!-- Totals Summary -->
            <div class="soft-surface p-4 text-sm space-y-1.5" style="background:#fff0b7;">
              <div class="flex justify-between font-bold"><span>${esc(t.subtotal)}</span><span>${esc(fmtMoney(calc.subtotal, bill.currency))}</span></div>
              <div class="flex justify-between font-bold"><span>${esc(t.taxLabel)}</span><span>${esc(fmtMoney(calc.taxAmt, bill.currency))}</span></div>
              <div class="flex justify-between font-bold"><span>${esc(t.serviceLabel)}</span><span>${esc(fmtMoney(calc.serviceAmt, bill.currency))}</span></div>
              <div class="flex justify-between font-extrabold text-base pt-1.5 border-t border-[#d8c47a]"><span>${esc(t.grandTotal)}</span><span>${esc(fmtMoney(calc.grandTotal, bill.currency))}</span></div>
