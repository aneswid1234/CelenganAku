      rows.push([]);
      rows.push(["[BUDGET]"]);
      rows.push(["Bulan", "Kategori", "Batas", "Mata Uang"]);
      state.budgets.forEach(b => rows.push([b.month, b.category, b.limit, b.currency || "IDR"]));
      rows.push([]);
      rows.push(["[PATUNGAN]"]);
      rows.push(["Tagihan", "Tanggal", "Mode", "Mata Uang", "Total Akhir", "Teman", "Tagihan Teman", "Terbayar", "Sisa", "Status"]);
      state.splitBills.forEach(b => {
        const calc = calcBillTotals(b);
        calc.friendStats.forEach(st => {
          rows.push([b.title, b.date, b.mode, b.currency, calc.grandTotal, st.friend.name, st.owed, st.paid, st.remain, st.status]);
        });
      });

      const csvText = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\n");
      downloadFile(csvText, `celengan-aku-data-${dateStamp}.csv`, "text/csv;charset=utf-8;");
      showToast(T().toastExportCsv);
    };

    // =====================================================
    // MASTER RENDER & EVENT LISTENERS
    // =====================================================
    const renderAll = () => {
      applyTranslations();
      renderNav();
      renderHome();
      renderWallets();
      renderActivity();
      renderBudgets();
      renderSplitBills();
      renderProfile();
      lucide.createIcons();
    };

    // Quick Action Buttons
    document.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const act = btn.dataset.action;
        if (act === "wallet") openWalletModal();
        else if (act === "budget") openBudgetModal();
        else openTxModal(act);
      });
    });

    // Header & Preferences Controls
    $("display-currency").addEventListener("change", e => { state.preferences.currency = e.target.value; saveState(); renderAll(); });
    $("default-currency").addEventListener("change", e => { state.preferences.currency = e.target.value; saveState(); renderAll(); });
    $("display-lang").addEventListener("change", e => { state.preferences.lang = e.target.value; saveState(); renderAll(); });
    $("auth-lang").addEventListener("change", e => { state.preferences.lang = e.target.value; saveState(); applyTranslations(); });
    $("privacy-btn").addEventListener("click", () => { state.preferences.hideHome = !state.preferences.hideHome; saveState(); renderAll(); });
    $("wallets-privacy-btn").addEventListener("click", () => { state.preferences.hideWallets = !state.preferences.hideWallets; saveState(); renderAll(); });
    $("privacy-setting").addEventListener("change", e => {
      const hide = e.target.value === "hide";
      state.preferences.hideHome = hide;
      state.preferences.hideWallets = hide;
      saveState();
      renderAll();
    });
    $("usd-rate").addEventListener("change", e => { state.preferences.usdRate = Math.max(1, Number(e.target.value) || 16000); saveState(); renderAll(); });
    $("eur-rate").addEventListener("change", e => { state.preferences.eurRate = Math.max(1, Number(e.target.value) || 17500); saveState(); renderAll(); });

    // Activity Filter Controls
    $("search").addEventListener("input", renderActivity);
    $("type-filter").addEventListener("change", () => { fillCategoryFilter(); renderActivity(); });
    $("category-filter").addEventListener("change", renderActivity);
    $("wallet-filter").addEventListener("change", renderActivity);
    $("date-from").addEventListener("change", renderActivity);
    $("date-to").addEventListener("change", renderActivity);
    $("activity-chart-type").addEventListener("change", renderActivity);
    $("btn-reset-filter").addEventListener("click", () => {
      $("search").value = "";
      $("type-filter").value = "all";
      fillCategoryFilter();
      $("category-filter").value = "all";
      $("wallet-filter").value = "all";
      $("date-from").value = "";
      $("date-to").value = "";
      renderActivity();
    });
    $("copy-csv").addEventListener("click", () => {
      const list = getFilteredTransactions();
      const header = ["Tanggal", "Jenis", "Kategori", "Nominal", "Mata Uang", "Dompet", "Catatan"];
      const csv = [header, ...list.map(tx => [tx.date, tx.type, tx.category, tx.amount, tx.currency, walletById(tx.walletId)?.name || "", tx.note || ""])]
        .map(r => r.map(csvCell).join(",")).join("\n");
      copyTextSafe(csv, T().toastCopyCsv);
    });

    // Profile Controls
    $("btn-edit-profile").addEventListener("click", openEditProfileModal);
    $("btn-export-json").addEventListener("click", exportAllJson);
    $("btn-export-csv").addEventListener("click", exportAllCsv);
    $("income-category-tab").addEventListener("click", () => { selectedCategoryTab = "income"; renderProfile(); });
    $("expense-category-tab").addEventListener("click", () => { selectedCategoryTab = "expense"; renderProfile(); });
    $("category-form").addEventListener("submit", async e => {
      e.preventDefault();
      const val = $("new-category").value.trim();
      if (!val) return;
      const arr = state.categories[selectedCategoryTab];
      if (!arr.includes(val)) {
        const { error } = await sb
          .from("categories")
          .insert({ user_id: currentUserId, name: val, kind: selectedCategoryTab });
        if (error) {
          showToast(XL("errAddCat") + error.message);
          return;
        }
        await reloadFromDatabase();
      }
      $("new-category").value = "";
      saveState();
      renderProfile();
      fillCategoryFilter();
      showToast(T().toastSaved);
    });

    // Budget & Split Bill Controls
    $("budget-month-filter").addEventListener("change", e => { selectedBudgetMonth = e.target.value || THIS_MONTH; renderBudgets(); });
    $("btn-new-bill").addEventListener("click", openNewBillModal);
    $("logo-link").addEventListener("click", e => { e.preventDefault(); switchPage("home"); });

    // Auth Screen Event Listeners
    $("tab-login").addEventListener("click", () => setAuthTab("login"));
    $("tab-register").addEventListener("click", () => setAuthTab("register"));

    const bindPasswordToggle = (btnId, inputId) => {
      $(btnId).addEventListener("click", () => {
        const inp = $(inputId);
        const isHidden = inp.type === "password";
        inp.type = isHidden ? "text" : "password";
        $(btnId).innerHTML = `<i data-lucide="${isHidden ? "eye-off" : "eye"}" class="w-4 h-4"></i>`;
        lucide.createIcons({ nodes: [$(btnId)] });
      });
    };
    bindPasswordToggle("toggle-login-pw", "login-password");
    bindPasswordToggle("toggle-reg-pw", "reg-password");
    bindPasswordToggle("toggle-reg-confirm", "reg-confirm");

    // ---------- Supabase Auth ----------
    const SUPABASE_URL = "https://afrmxditmhbhgsggtvbp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FJGFq4Tego75aszka09Fhg_1SswKRu3";
    const REMEMBER_KEY = "celengan_remember";
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const USERNAME_RE = /^[a-z0-9._]{3,30}$/;
    const normUsername = s => String(s || "").trim().replace(/^@/, "").toLowerCase();

    // Satu klien saja. Sesi disimpan di sessionStorage kalau "Ingat saya" tidak dicentang,
    // dan di localStorage kalau dicentang.
    const authStorage = {
      getItem: k => sessionStorage.getItem(k) ?? localStorage.getItem(k),
      setItem: (k, v) => (localStorage.getItem(REMEMBER_KEY) === "0" ? sessionStorage : localStorage).setItem(k, v),
      removeItem: k => { sessionStorage.removeItem(k); localStorage.removeItem(k); }
    };
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storage: authStorage }
    });

    let currentUserId = null;
    const PALETTE = ["#b8d9fb", "#c5ebce", "#ffe18c", "#e9d8f8", "#ffc6d3"];

    // Muat ulang dompet dan kategori dari database ke state (sumber kebenaran)
    const reloadFromDatabase = async () => {
      const [catRes, walletRes, balRes, txRes, budgetRes] = await Promise.all([
        sb.from("categories").select("id, name, kind").order("id"),
        sb.from("wallets").select("id, name, type, currency, logo_url").order("id"),
        sb.from("wallet_balances").select("id, current_balance").order("id"),
        sb.from("transactions")
          .select("id, type, amount, wallet_id, to_wallet_id, to_amount, category_id, transaction_date, notes")
          .neq("type", "adjustment")
          .order("transaction_date", { ascending: false })
          .order("id", { ascending: false }),
        sb.from("budgets").select("id, category_id, amount, currency, month").order("id")
      ]);
      const err = catRes.error || walletRes.error || balRes.error || txRes.error || budgetRes.error;
      if (err) {
        showToast(XL("errLoad") + err.message);
        return;
      }
      const balById = new Map(balRes.data.map(b => [b.id, Number(b.current_balance)]));
      state.categoryRows = catRes.data;
      state.categories = {
        income: catRes.data.filter(c => c.kind === "income").map(c => c.name),
        expense: catRes.data.filter(c => c.kind === "expense").map(c => c.name)
      };
      state.wallets = walletRes.data.map((w, i) => ({
        id: String(w.id),
        dbId: w.id,
        name: w.name,
        type: w.type,
        balance: balById.get(w.id) ?? 0,
        currency: w.currency,
        color: PALETTE[i % PALETTE.length],
        icon: "💳",
        logo: w.logo_url || ""
      }));

      // Transaksi dari database (koreksi saldo tidak ditampilkan sebagai transaksi)
      const catName = new Map(catRes.data.map(c => [c.id, c.name]));
      const walletCur = new Map(walletRes.data.map(w => [w.id, w.currency]));
      state.transactions = txRes.data.map(x => ({
        id: String(x.id),
        dbId: x.id,
        type: x.type,
        amount: Number(x.amount),
        currency: walletCur.get(x.wallet_id) || "IDR",
        category: x.type === "transfer" ? "Transfer" : (catName.get(x.category_id) || "-"),
        walletId: String(x.wallet_id),
        toWalletId: x.to_wallet_id ? String(x.to_wallet_id) : "",
        date: x.transaction_date,
        note: x.notes || ""
      }));
      // Patungan: tagihan, peserta, item, pembagi, dan cicilan
      const [billRes, partRes, itemRes, asgRes, payRes] = await Promise.all([
        sb.from("split_bills")
          .select("id, title, bill_date, currency, mode, tax_type, tax_value, service_type, service_value")
          .order("bill_date", { ascending: false })
          .order("id", { ascending: false }),
        sb.from("bill_participants").select("id, bill_id, name, manual_amount").order("id"),
        sb.from("bill_items").select("id, bill_id, name, price, qty").order("id"),
        sb.from("bill_item_assignees").select("item_id, participant_id"),
        sb.from("bill_payments").select("id, participant_id, amount, paid_on, note").order("id")
      ]);
      const billErr = billRes.error || partRes.error || itemRes.error || asgRes.error || payRes.error;
      if (billErr) {
        showToast(XL("errLoadBill") + billErr.message);
        state.splitBills = [];
      } else {
        const grp = (arr, k) => arr.reduce((m, x) => ((m[x[k]] ||= []).push(x), m), {});
        const partsByBill = grp(partRes.data, "bill_id");
        const itemsByBill = grp(itemRes.data, "bill_id");
        const payByPart = grp(payRes.data, "participant_id");
        const asgByItem = grp(asgRes.data, "item_id");
        state.splitBills = billRes.data.map(b => ({
          id: String(b.id),
          dbId: b.id,
          title: b.title,
          date: b.bill_date,
          currency: b.currency,
          mode: b.mode,
          taxType: b.tax_type === "percent" ? "percent" : "amount",
          taxValue: Number(b.tax_value),
          serviceType: b.service_type === "percent" ? "percent" : "amount",
          serviceValue: Number(b.service_value),
          friends: (partsByBill[b.id] || []).map(pp => ({
            id: String(pp.id),
            dbId: pp.id,
            name: pp.name,
            manualAmount: Number(pp.manual_amount),
            installments: (payByPart[pp.id] || []).map(x => ({
              id: String(x.id),
              amount: Number(x.amount),
              date: x.paid_on,
              note: x.note || ""
            }))
          })),
          items: (itemsByBill[b.id] || []).map(it => ({
            id: String(it.id),
            dbId: it.id,
            name: it.name,
            price: Number(it.price),
            qty: it.qty,
            assignedTo: (asgByItem[it.id] || []).map(a => String(a.participant_id))
          }))
        }));
      }

      state.budgets = budgetRes.data.map(x => ({
        id: String(x.id),
        dbId: x.id,
        category: catName.get(x.category_id) || "-",
        limit: Number(x.amount),
        currency: x.currency,
        month: String(x.month).slice(0, 7)
      }));
      saveState();
    };

    const loadProfileIntoState = async user => {
      const { data } = await sb
        .from("profiles")
        .select("full_name, username, email")
        .eq("id", user.id)
        .maybeSingle();
      state.profile.name = data?.full_name || user.user_metadata?.full_name || state.profile.name;
      state.profile.username = data?.username ? "@" + data.username : state.profile.username;
      state.profile.email = data?.email || user.email;
      currentUserId = user.id;
      await reloadFromDatabase();
      saveState();
    };

    $("login-form").addEventListener("submit", async e => {
      e.preventDefault();
      const t = T();
      const rawId = $("login-identifier").value.trim();
      const pwVal = $("login-password").value;
      const remember = $("login-remember").checked;

      if (!rawId || !pwVal) {
        showAuthError(t.errEmptyLogin);
        return;
      }

      let email = rawId;
      if (!EMAIL_RE.test(rawId)) {
        // Pastikan pencarian username dilakukan sebagai tamu, bukan sebagai sesi lama
        await sb.auth.signOut({ scope: "local" });
        const { data: foundEmail, error: lookupErr } = await sb.rpc("email_for_login", { login_id: rawId });
        if (lookupErr || !foundEmail) {
          showAuthError(t.errInvalidLogin);
          return;
        }
        email = foundEmail;
      }

      localStorage.setItem(REMEMBER_KEY, remember ? "1" : "0");
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pwVal });
      if (error || !data.session) {
        showAuthError(t.errInvalidLogin);
        return;
      }

      showAuthError("");
      await loadProfileIntoState(data.session.user);
      sessionLoggedIn = true;
      currentPage = "home";
      updateAuthVisibility();
      showToast(t.toastLoginOk(state.profile.name));
    });

    $("register-form").addEventListener("submit", async e => {
      e.preventDefault();
      const t = T();
      const name = $("reg-name").value.trim();
      const username = normUsername($("reg-username").value);
      const email = $("reg-email").value.trim();
      const pw = $("reg-password").value;
      const confirmPw = $("reg-confirm").value;

      if (!name || !username || !email || !pw || !confirmPw) {
        showAuthError(t.errEmptyReg);
        return;
      }
      if (!USERNAME_RE.test(username)) {
        showAuthError(t.errInvalidUsername);
        return;
      }
      if (!EMAIL_RE.test(email)) {
        showAuthError(t.errInvalidEmail);
        return;
      }
      if (pw.length < 6) {
        showAuthError(t.errShortPw);
        return;
      }
      if (pw !== confirmPw) {
        showAuthError(t.errMismatchPw);
        return;
      }

      localStorage.setItem(REMEMBER_KEY, "1");
      const { data, error } = await sb.auth.signUp({
        email,
        password: pw,
        options: { data: { full_name: name, username } }
      });

      if (error) {
        const msg = /already registered/i.test(error.message)
          ? t.errEmailTaken
          : `${t.errRegFailed} (${error.message})`;
        showAuthError(msg);
        return;
      }

      showAuthError("");
      $("register-form").reset();
      if (!data.session) {
        // Konfirmasi email aktif: pengguna harus klik tautan dulu
        setAuthTab("login");
        showToast(t.toastCheckEmail);
        return;
      }
      await loadProfileIntoState(data.session.user);
      sessionLoggedIn = true;
      currentPage = "home";
      updateAuthVisibility();
      showToast(t.toastRegOk(name));
    });

    $("btn-forgot-pw").addEventListener("click", () => {
      const t = T();
      openModal(t.forgotTitle, `
        <p class="muted text-sm font-bold mb-4">${esc(t.forgotDesc)}</p>
        <form id="forgot-form" class="space-y-4">
          <div>
            <label class="field-label">${esc(t.regEmail)}</label>
            <input name="email" type="email" class="field" placeholder="nama@email.com" required>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" id="m-cancel" class="app-button light-button text-sm">${esc(t.cancel)}</button>
            <button type="submit" class="app-button text-sm" style="background:#d9c6f5;color:#48342f;">${esc(t.forgotSend)}</button>
          </div>
        </form>
      `);
      $("m-cancel").onclick = closeModal;
      $("forgot-form").onsubmit = async ev => {
        ev.preventDefault();
        const email = new FormData(ev.target).get("email");
        closeModal();
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href.split("#")[0]
        });
        showToast(error ? t.errRegFailed : t.toastResetSent(email));
      };
    });

    $("btn-logout").addEventListener("click", async () => {
      await sb.auth.signOut();
      sessionLoggedIn = false;
      state.auth.isLoggedIn = false;
      saveState();
      $("login-password").value = "";
      updateAuthVisibility();
      showToast(T().toastLogout);
    });

    // Initialize Application: cek sesi yang sudah ada
    window.addEventListener("load", async () => {
      try {
        const { data } = await sb.auth.getSession();
        if (data.session) {
          await loadProfileIntoState(data.session.user);
          sessionLoggedIn = true;
        } else {
          sessionLoggedIn = false;
        }
      } catch (err) {
        console.error("Gagal memuat data akun:", err);
        showAuthError(XL("errLoad") + (err?.message || err));
        sessionLoggedIn = false;
      }
      authChecked = true;
      updateAuthVisibility();
    });
  })();
  </script>
</body>
</html>
